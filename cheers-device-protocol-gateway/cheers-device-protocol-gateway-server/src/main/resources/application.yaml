spring:
  application:
    name: cheers-device-protocol-gateway-server
  profiles:
    active: local
  main:
    allow-circular-references: true
    allow-bean-definition-overriding: true
  config:
    import:
      - optional:classpath:application-${spring.profiles.active}.yaml
      - optional:nacos:${spring.application.name}-${spring.profiles.active}.yaml
  jackson:
    serialization:
      write-dates-as-timestamps: true
      fail-on-empty-beans: false

server:
  # HTTP（Feign RPC）与 WebSocket 同端口；可用 DEVICE_PROTOCOL_GATEWAY_PORT 覆盖
  port: ${DEVICE_PROTOCOL_GATEWAY_PORT:8095}

logging:
  file:
    name: ${user.home}/logs/${spring.application.name}.log

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui
  default-flat-param-object: true

knife4j:
  enable: true
  setting:
    language: zh_cn

cheers:
  device-protocol-gateway:
    path-pattern: /{deviceId}
    allowed-origins:
      - "*"
    # 上行回写巡检任务；本地直连 inspection-task 端口（Nacos 可用后可改为服务发现 URL）
    uplink-notify-url: ${DEVICE_PROTOCOL_UPLINK_NOTIFY_URL:http://127.0.0.1:15095/rpc-api/inspection-task/device-uplink/notify}
    # 大疆上云：默认关。打开后只应答设备上线（拓扑 + 许可），不下发航线。
    dji-cloud:
      enabled: ${DJI_CLOUD_ENABLED:false}
      broker-url: ${DJI_CLOUD_BROKER_URL:}
      username: ${DJI_CLOUD_MQTT_USERNAME:}
      password: ${DJI_CLOUD_MQTT_PASSWORD:}
      client-id: ${DJI_CLOUD_CLIENT_ID:cheers-dji-cloud}
      app-id: ${DJI_CLOUD_APP_ID:}
      app-key: ${DJI_CLOUD_APP_KEY:}
      app-license: ${DJI_CLOUD_APP_LICENSE:}
      ntp-server-host: ${DJI_CLOUD_NTP_HOST:ntp.aliyun.com}
      ntp-server-port: ${DJI_CLOUD_NTP_PORT:123}
      organization-id: ${DJI_CLOUD_ORGANIZATION_ID:}
      organization-name: ${DJI_CLOUD_ORGANIZATION_NAME:}
  info:
    version: 1.0.0
    base-package: cn.cheers.x.device.protocolgateway
  web:
    admin-ui:
      url: http://dashboard.local
  swagger:
    title: 设备协议网关
    description: 设备 WebSocket 与协议监控
    version: ${cheers.info.version}
  security:
    mock-enable: true
  tenant:
    enable: false

--- #################### 注册中心 ####################

spring:
  cloud:
    nacos:
      server-addr: 127.0.0.1:8848
      username: nacos
      password: nacos
      discovery:
        namespace: dev
        group: DEFAULT_GROUP
        metadata:
          version: 1.0.0
      config:
        namespace: dev
        group: DEFAULT_GROUP
