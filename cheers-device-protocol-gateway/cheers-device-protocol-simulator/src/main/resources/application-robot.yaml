# 机器人对端。和无人机是两个进程，都连协议网关 8095，设备编号不同。
spring:
  application:
    name: cheers-device-protocol-robot-simulator

server:
  port: 8302

cheers:
  device-protocol-simulator:
    role: robot
    # 小型机器人。用台账登记编码，不自编编号。这台的设备编号列是空的。
    # 另一台已创建的大型机器人登记编码是 equipment-255d493d7aab4b3c9b177c2a7ec156fb，要另开一个进程。
    websocket-url: ${ROBOT_SIMULATOR_WEBSOCKET_URL:ws://127.0.0.1:8095/equipment-c9fb0e4891064f759509ed72c92fb71c}
    device-id: ${ROBOT_SIMULATOR_DEVICE_ID:equipment-c9fb0e4891064f759509ed72c92fb71c}
