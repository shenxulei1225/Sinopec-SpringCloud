# 复制为 application-local.yml（已 gitignore），本地联调时填写真实连接。
# 启动：mvn spring-boot:run -Dspring-boot.run.profiles=local
# 或在 IDE 中激活 profile local。

spring:
  datasource:
    url: jdbc:mysql://YOUR_HOST:3306/plc?useUnicode=true&useSSL=false&characterEncoding=utf8&serverTimezone=UTC
    username: YOUR_USER
    password: YOUR_PASSWORD

opcua:
  server-url: opc.tcp://YOUR_OPC_HOST:4840/
