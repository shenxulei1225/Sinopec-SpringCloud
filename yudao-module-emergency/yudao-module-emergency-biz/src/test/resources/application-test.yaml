spring:
  application:
    name: emergency-biz-test
  # 数据源配置由 Testcontainers 动态注入
  
  # Spring Cloud Alibaba 配置（测试环境禁用外部服务）
  cloud:
    nacos:
      discovery:
        enabled: false  # 禁用 Nacos 服务发现
      config:
        enabled: false  # 禁用 Nacos 配置中心
  
  # 排除自动配置类（这些配置类依赖外部服务，测试环境不需要）
  autoconfigure:
    exclude:
      # Nacos 相关
      - com.alibaba.cloud.nacos.discovery.NacosDiscoveryAutoConfiguration
      - com.alibaba.cloud.nacos.config.NacosConfigAutoConfiguration
      # Redis 相关（如果条件注解无法生效）
      - cn.iocoder.yudao.framework.redis.config.YudaoRedisAutoConfiguration
      # RPC 相关
      - cn.iocoder.yudao.framework.security.config.YudaoSecurityRpcAutoConfiguration
      - cn.iocoder.yudao.framework.tenant.config.YudaoTenantRpcAutoConfiguration
      # Tenant 相关
      - cn.iocoder.yudao.framework.tenant.config.YudaoTenantAutoConfiguration
      # Web 相关
      - cn.iocoder.yudao.framework.swagger.config.YudaoSwaggerAutoConfiguration
      - com.github.xiaoymin.knife4j.spring.configuration.Knife4jAutoConfiguration

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  global-config:
    db-config:
      logic-delete-value: true # PostgreSQL 使用 1 表示已删除
      logic-not-delete-value: false  # PostgreSQL 使用 false 表示未删除
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl  # 启用 SQL 日志输出

yudao:
  info:
    base-package: cn.iocoder.yudao
  web:
    admin-ui:
      url: http://localhost:48080
  access-log: # 测试环境也禁用访问日志，避免 Mock 请求体读取冲突
    enable: false

# 禁用 SpringDoc/Swagger（测试环境不需要 API 文档功能）
springdoc:
  api-docs:
    enabled: false



