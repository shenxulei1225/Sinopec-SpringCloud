--- #################### 生产环境配置 ####################
# 生产环境配置文件
# 使用方式：启动时指定 spring.profiles.active=prod

spring:
  # 数据源配置项（生产环境优化）
  datasource:
    druid:
      # 生产环境关闭Druid监控页面（安全考虑）
      stat-view-servlet:
        enabled: false
      web-stat-filter:
        enabled: false
      filter:
        stat:
          enabled: true
          log-slow-sql: true
          slow-sql-millis: 1000 # 生产环境慢SQL阈值：1秒
          merge-sql: true
    dynamic:
      druid:
        # 生产环境连接池配置（根据实际负载调整）
        initial-size: 5 # 初始连接数
        min-idle: 5 # 最小连接池数量
        max-active: 50 # 最大连接池数量（根据数据库服务器性能调整）
        max-wait: 60000 # 获取连接等待超时时间（1分钟）
        time-between-eviction-runs-millis: 60000 # 检测空闲连接的间隔（1分钟）
        min-evictable-idle-time-millis: 600000 # 连接最小生存时间（10分钟）
        max-evictable-idle-time-millis: 1800000 # 连接最大生存时间（30分钟）
        validation-query: SELECT 1
        test-while-idle: true
        test-on-borrow: false
        test-on-return: false
        pool-prepared-statements: true
        max-pool-prepared-statement-per-connection-size: 20
      datasource:
        master:
          # 生产环境使用环境变量配置数据库连接
          url: ${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:emergency}}
          username: ${DB_USER:postgres}
          password: ${DB_PASSWORD:}
          driver-class-name: org.postgresql.Driver

  # Redis 配置（生产环境）
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      timeout: 10000
      lettuce:
        pool:
          max-active: 20 # 最大连接数
          max-idle: 10 # 最大空闲连接
          min-idle: 5 # 最小空闲连接
          max-wait: 5000 # 最大等待时间

  # 日志配置（生产环境）
  logging:
    level:
      root: INFO
      cn.iocoder.yudao: INFO
      org.springframework: WARN
      com.alibaba.nacos: WARN
    file:
      name: ${LOG_PATH:/var/log/emergency}/emergency-server.log
      max-size: 100MB
      max-history: 30 # 保留30天的日志

  # Nacos配置（生产环境）
  cloud:
    nacos:
      server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
      username: ${NACOS_USERNAME:nacos}
      password: ${NACOS_PASSWORD:nacos}
      discovery:
        namespace: ${NACOS_NAMESPACE:prod}
        group: ${NACOS_GROUP:DEFAULT_GROUP}
        ip: ${SERVER_IP:} # 服务注册IP（自动检测）
        metadata:
          version: ${APP_VERSION:1.0.0}
      config:
        namespace: ${NACOS_NAMESPACE:prod}
        group: ${NACOS_GROUP:DEFAULT_GROUP}

--- #################### 监控相关配置 ####################

# Actuator 监控端点的配置项（生产环境）
management:
  endpoints:
    web:
      base-path: /actuator
      exposure:
        # 生产环境只暴露必要的端点
        include: health,info,metrics,prometheus
      # 生产环境建议配置访问控制
      # 可以通过Nginx反向代理配置IP白名单
  endpoint:
    health:
      show-details: when-authorized # 健康检查详情需要授权
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: ${spring.application.name}
      environment: prod

--- #################### 应急管理系统特定配置 ####################

emergency:
  # 备份配置
  backup:
    directory: ${BACKUP_DIR:/data/emergency/backups}
  
  # 缓存配置
  cache:
    # 生产环境缓存TTL（秒）
    default-ttl: 3600 # 1小时
    event-ttl: 1800 # 事件缓存30分钟
    timeline-ttl: 600 # 时间线缓存10分钟

--- #################### 安全配置 ####################

# 安全相关配置建议通过环境变量或配置中心管理
# 以下配置仅供参考

server:
  # 生产环境建议使用HTTPS
  # ssl:
  #   enabled: true
  #   key-store: ${SSL_KEYSTORE_PATH:}
  #   key-store-password: ${SSL_KEYSTORE_PASSWORD:}
  #   key-store-type: PKCS12
  #   key-alias: ${SSL_KEY_ALIAS:}
  
  # 生产环境建议配置访问超时
  connection-timeout: 20000 # 20秒
  compression:
    enabled: true # 启用响应压缩
    mime-types: application/json,application/xml,text/html,text/xml,text/plain
    min-response-size: 1024 # 最小压缩大小：1KB

