--- #################### 注册中心 + 配置中心相关配置 ####################

spring:
  cloud:
    nacos:
      server-addr: 127.0.0.1:8848 # Nacos 服务器地址
      username: nacos # Nacos 账号
      password: nacos # Nacos 密码
      discovery: # 【服务注册发现】配置项
        namespace: dev # 命名空间。这里使用 dev 开发环境
        group: DEFAULT_GROUP # 使用的 Nacos 配置分组,默认为 DEFAULT_GROUP
        ip: 127.0.0.1 # 服务注册 IP（本地开发使用 localhost）
        metadata:
          version: 1.0.0 # 服务实例的版本号,可用于灰度发布
      config: # 【配置中心】配置项
        namespace: dev # 命名空间。这里使用 dev 开发环境
        group: DEFAULT_GROUP # 使用的 Nacos 配置分组,默认为 DEFAULT_GROUP
    loadbalancer: # LoadBalancer 配置
      cache: # 缓存配置
        enabled: false # 禁用缓存,完全实时查询
      nacos: # Nacos 服务发现配置
        enabled: true # 启用 Nacos 服务发现
      clients: # 客户端配置
        default: # 默认客户端配置
          health-check: # 健康检查
            enabled: false # 禁用健康检查,避免额外开销
      ribbon: # Ribbon 配置（如果使用）
        enabled: false # 禁用 Ribbon,使用 Spring Cloud LoadBalancer
    openfeign: # OpenFeign 配置
      client:
        config:
          default: # 默认配置,适用于所有 Feign 客户端
            loggerLevel: FULL # 日志级别：NONE, BASIC, HEADERS, FULL
            connectTimeout: 5000 # 连接超时时间（毫秒）
            readTimeout: 10000 # 读取超时时间（毫秒）
            retryer: # 重试配置
              maxAttempts: 3 # 最大重试次数（包括首次调用）
              backoff: # 退避策略
                initialInterval: 100 # 初始间隔（毫秒）
                multiplier: 1.5 # 乘数
                maxInterval: 1000 # 最大间隔（毫秒）

--- #################### 数据库相关配置 ####################

spring:
  # 数据源配置项
  autoconfigure:
    exclude:
  datasource:
    druid: # Druid 【监控】相关的全局配置
      web-stat-filter:
        enabled: true
      stat-view-servlet:
        enabled: true
        allow: # 设置白名单,不填则允许所有访问
        url-pattern: /druid/*
        login-username: # 控制台管理用户名和密码
        login-password:
      filter:
        stat:
          enabled: true
          log-slow-sql: true # 慢 SQL 记录
          slow-sql-millis: 100
          merge-sql: true
        wall:
          config:
            multi-statement-allow: true
    dynamic: # 多数据源配置
      druid: # Druid 【连接池】相关的全局配置
        initial-size: 1 # 初始连接数
        min-idle: 1 # 最小连接池数量
        max-active: 20 # 最大连接池数量
        max-wait: 60000 # 配置获取连接等待超时的时间,单位：毫秒（1 分钟）
        time-between-eviction-runs-millis: 60000 # 配置间隔多久才进行一次检测,检测需要关闭的空闲连接,单位：毫秒（1 分钟）
        min-evictable-idle-time-millis: 600000 # 配置一个连接在池中最小生存的时间,单位：毫秒（10 分钟）
        max-evictable-idle-time-millis: 1800000 # 配置一个连接在池中最大生存的时间,单位：毫秒（30 分钟）
        validation-query: SELECT 1 # PostgreSQL 连接有效性检查
        test-while-idle: true
        test-on-borrow: false
        test-on-return: false
        pool-prepared-statements: true # 是否开启 PreparedStatement 缓存
        max-pool-prepared-statement-per-connection-size: 20 # 每个连接缓存的 PreparedStatement 数量
      primary: master
      datasource:
        master:
          url: jdbc:postgresql://127.0.0.1:5432/zhgl # PostgreSQL 数据源
          username: ${PG_USER:postgres}
          password: ${PG_PASSWORD:Coolhomer}
          driver-class-name: org.postgresql.Driver
        slave: # 模拟从库,可根据自己需要修改
          lazy: true # 开启懒加载,保证启动速度
          url: jdbc:postgresql://127.0.0.1:5432/zhgl # PostgreSQL 数据源
          username: ${PG_USER:postgres}
          password: ${PG_PASSWORD:Coolhomer}
          driver-class-name: org.postgresql.Driver

  # Redis 配置。Redisson 默认的配置足够使用,一般不需要进行调优
  data:
    redis:
      host: 127.0.0.1 # 地址
      port: 6379 # 端口
      database: 0 # 数据库索引
      password: 123456 # 密码,建议生产环境开启

--- #################### MQ 消息队列相关配置 ####################

# rocketmq 配置项,对应 RocketMQProperties 配置类
rocketmq:
  name-server: 127.0.0.1:9876 # RocketMQ Namesrv

spring:
  # RabbitMQ 配置项,对应 RabbitProperties 配置类
  rabbitmq:
    host: 127.0.0.1 # RabbitMQ 服务的地址
    port: 5672 # RabbitMQ 服务的端口
    username: guest # RabbitMQ 服务的账号
    password: guest # RabbitMQ 服务的密码
  # Kafka 配置项,对应 KafkaProperties 配置类
  kafka:
    bootstrap-servers: 127.0.0.1:9092 # 指定 Kafka Broker 地址,可以设置多个,以逗号分隔

--- #################### 定时任务相关配置 ####################

xxl:
  job:
    enabled: false # 是否开启调度中心,默认为 true 开启
    admin:
      addresses: http://127.0.0.1:9090/xxl-job-admin # 调度中心部署跟地址

--- #################### 服务保障相关配置 ####################

# Lock4j 配置项
lock4j:
  acquire-timeout: 3000 # 获取分布式锁超时时间,默认为 3000 毫秒
  expire: 30000 # 分布式锁的超时时间,默认为 30 毫秒

--- #################### 监控相关配置 ####################

# Actuator 监控端点的配置项
management:
  endpoints:
    web:
      base-path: /actuator # Actuator 提供的 API 接口的根目录。默认为 /actuator
      exposure:
        include: '*' # 需要开放的端点。默认值只打开 health 和 info 两个端点。通过设置 * ,可以开放所有端点。

# Spring Boot Admin 配置项
spring:
  boot:
    admin:
      # Spring Boot Admin Client 客户端的相关配置
      client:
        instance:
          service-host-type: IP # 注册实例时,优先使用 IP [IP, HOST_NAME, CANONICAL_HOST_NAME]
      # Spring Boot Admin Server 服务端的相关配置
      context-path: /admin # 配置 Spring

# 日志文件配置
logging:
  level:
    # 配置自己写的 MyBatis Mapper 打印日志
    cn.iocoder.yudao.module.emergency.dal.mysql: debug
    org.springframework.context.support.PostProcessorRegistrationDelegate: ERROR # TODO 芋艿：先禁用,Spring Boot 3.X 存在部分错误的 WARN 提示
    # Feign 详细日志配置 - 启用 DEBUG 以调试 LoadBalancer 服务发现
    feign: DEBUG # 启用 Feign 详细日志
    org.springframework.cloud.openfeign: DEBUG # Spring Cloud OpenFeign 日志
    org.springframework.cloud.loadbalancer: DEBUG # LoadBalancer 日志
    org.springframework.cloud.client: DEBUG # Spring Cloud 客户端日志
    com.alibaba.nacos: DEBUG # Nacos 客户端日志
    # 启用 DEBUG 级别以调试服务发现
    root: INFO

--- #################### Cheers 相关配置 ####################

cheers:
  env: # 多环境的配置项
    tag: ${HOSTNAME}
  security:
    mock-enable: true
  access-log: # 访问日志的配置项
    enable: false

# Emergency 模块专用数据库配置
emergency:
  datasource:
    url: jdbc:postgresql://127.0.0.1:5432/zhgl # PostgreSQL 数据源
    username: ${PG_USER:postgres}
    password: ${PG_PASSWORD:Coolhomer}
    driver-class-name: org.postgresql.Driver


