version: '3.8'

services:
  emergency-server:
    build:
      context: .
      dockerfile: Dockerfile
    image: yudao-module-emergency-server:latest
    container_name: yudao-module-emergency-server
    ports:
      - "48090:48090"
    environment:
      - TZ=Asia/Shanghai
      - JAVA_OPTS=-Xms512m -Xmx512m
      - SPRING_PROFILES_ACTIVE=prod
    volumes:
      - ./logs:/yudao-module-emergency-server/logs
    networks:
      - yudao-network
    restart: unless-stopped
    depends_on:
      - postgres
      - redis
      - nacos

  postgres:
    image: postgres:15-alpine
    container_name: emergency-postgres
    environment:
      - POSTGRES_DB=emergency
      - POSTGRES_USER=root
      - POSTGRES_PASSWORD=123456
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - yudao-network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: emergency-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - yudao-network
    restart: unless-stopped

  nacos:
    image: nacos/nacos-server:v2.2.3
    container_name: emergency-nacos
    environment:
      - MODE=standalone
      - SPRING_DATASOURCE_PLATFORM=postgresql
      - MYSQL_SERVICE_HOST=postgres
      - MYSQL_SERVICE_DB_NAME=nacos
      - MYSQL_SERVICE_PORT=5432
      - MYSQL_SERVICE_USER=root
      - MYSQL_SERVICE_PASSWORD=123456
    ports:
      - "8848:8848"
    networks:
      - yudao-network
    restart: unless-stopped
    depends_on:
      - postgres

networks:
  yudao-network:
    driver: bridge

volumes:
  postgres-data:
  redis-data:








