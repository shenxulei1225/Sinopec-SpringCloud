version: '3.8'

services:
  emergency-server:
    image: emergency-server:latest
    container_name: emergency-server
    restart: always
    ports:
      - "48090:48090"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - DB_HOST=${DB_HOST:-postgres}
      - DB_PORT=${DB_PORT:-5432}
      - DB_NAME=${DB_NAME:-emergency}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-}
      - REDIS_HOST=${REDIS_HOST:-redis}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - NACOS_SERVER_ADDR=${NACOS_SERVER_ADDR:-nacos:8848}
      - NACOS_USERNAME=${NACOS_USERNAME:-nacos}
      - NACOS_PASSWORD=${NACOS_PASSWORD:-nacos}
      - NACOS_NAMESPACE=${NACOS_NAMESPACE:-prod}
      - LOG_PATH=/var/log/emergency
      - BACKUP_DIR=/data/emergency/backups
      - JAVA_OPTS=-Xms2g -Xmx4g -XX:+UseG1GC -XX:MaxGCPauseMillis=200
    volumes:
      - ./logs:/var/log/emergency
      - ./backups:/data/emergency/backups
    depends_on:
      - postgres
      - redis
      - nacos
    networks:
      - emergency-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:48090/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  postgres:
    image: postgres:15-alpine
    container_name: emergency-postgres
    restart: always
    environment:
      - POSTGRES_DB=${DB_NAME:-emergency}
      - POSTGRES_USER=${DB_USER:-postgres}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "${DB_PORT:-5432}:5432"
    networks:
      - emergency-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: emergency-redis
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD:-}
    volumes:
      - redis-data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    networks:
      - emergency-network
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  nacos:
    image: nacos/nacos-server:v2.2.3
    container_name: emergency-nacos
    restart: always
    environment:
      - MODE=standalone
      - NACOS_AUTH_ENABLE=true
      - NACOS_AUTH_IDENTITY_KEY=${NACOS_USERNAME:-nacos}
      - NACOS_AUTH_IDENTITY_VALUE=${NACOS_PASSWORD:-nacos}
    volumes:
      - nacos-data:/home/nacos/data
    ports:
      - "8848:8848"
      - "9848:9848"
    networks:
      - emergency-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8848/nacos/"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres-data:
  redis-data:
  nacos-data:

networks:
  emergency-network:
    driver: bridge








