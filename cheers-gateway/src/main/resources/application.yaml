              uri: grayLb://platformrouting-server
              predicates:
                - Path=/admin-api/platform/routing/**
              filters:
                - RewritePath=/admin-api/platform/routing/v3/api-docs, /v3/api-docs
            ## twin-server 服务
            - id: twin-admin-api # 路由的编号
              uri: grayLb://twin-server
              predicates: # 断言，作为路由的匹配条件，对应 RouteDefinition 数组
                - Path=/admin-api/twin/**
              filters:
                - RewritePath=/admin-api/twin/v3/api-docs, /v3/api-docs # 配置，保证转发到 /v3/api-docs
          x-forwarded:
            prefix-enabled: false # 避免 Swagger 重复带上额外的 /admin-api/system 前缀
          default-filters:
            - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin # 采用 https://github.com/spring-cloud/spring-cloud-gateway/pull/866 解决响应头重复问题

