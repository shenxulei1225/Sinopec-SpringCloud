              filters:
                - RewritePath=/admin-api/platform/capability-packs/v3/api-docs, /v3/api-docs
            ## platformruntime-server 服务
            - id: platformruntime-admin-api
              uri: grayLb://platformruntime-server
              predicates:
                - Path=/admin-api/platform/runtime/**
              filters:
                - RewritePath=/admin-api/platform/runtime/v3/api-docs, /v3/api-docs
            ## platformtopology-server 服务（含多网络 Graph / Exchange / 机动剖面）
            - id: platformtopology-admin-api
              uri: grayLb://platformtopology-server
              predicates:
                - Path=/admin-api/platform/topology/**,/admin-api/platform/path/**
              filters:
                - RewritePath=/admin-api/platform/topology/v3/api-docs, /v3/api-docs
            ## platformrouting-server 服务
