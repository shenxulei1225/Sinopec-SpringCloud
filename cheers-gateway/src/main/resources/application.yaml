            ## platformresource-server 服务
            - id: platformresource-admin-api
              uri: grayLb://platformresource-server
              predicates:
                - Path=/admin-api/platformresource/**
              filters:
                - RewritePath=/admin-api/platformresource/v3/api-docs, /v3/api-docs
            ## platformorchestration-server 编排入口（优先于 runtime 通配）
            - id: platformorchestration-schedule-api
              uri: grayLb://platformorchestration-server
              predicates:
                - Path=/admin-api/platform/runtime/schedule/**,/admin-api/platform/orchestration/**
              filters:
