              filters:
                - RewritePath=/admin-api/crm/v3/api-docs, /v3/api-docs # 配置，保证转发到 /v3/api-docs
            ## ai-server 服务
            - id: ai-admin-api # 路由的编号
              uri: grayLb://ai-server
              predicates: # 断言，作为路由的匹配条件，对应 RouteDefinition 数组
