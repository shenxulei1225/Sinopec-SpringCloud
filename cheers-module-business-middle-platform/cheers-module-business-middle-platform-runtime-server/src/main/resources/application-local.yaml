--- #################### 注册中心 + 配置中心相关配置 ####################

spring:
  cloud:
    nacos:
      server-addr: 127.0.0.1:8848
      username: nacos
      password: nacos
      discovery:
        namespace: dev
        group: DEFAULT_GROUP
        ip: 127.0.0.1
        metadata:
          version: 1.0.0
      config:
        namespace: dev
        group: DEFAULT_GROUP
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration
    table: flyway_schema_history_platform
    schemas: platform
    default-schema: platform
    create-schemas: true
    repair-on-migrate: true
  autoconfigure:
    exclude:
  datasource:
    druid:
      web-stat-filter:
        enabled: true
      stat-view-servlet:
        enabled: true
        allow:
        url-pattern: /druid/*
        login-username:
        login-password:
      filter:
        stat:
          enabled: true
          log-slow-sql: true
          slow-sql-millis: 100
          merge-sql: true
        wall:
          config:
            multi-statement-allow: true
    dynamic:
      druid:
        initial-size: 1
        min-idle: 1
        max-active: 20
        max-wait: 60000
        time-between-eviction-runs-millis: 60000
        min-evictable-idle-time-millis: 600000
        max-evictable-idle-time-millis: 1800000
        validation-query: SELECT 1
        driver-class-name: org.postgresql.Driver
        test-while-idle: true
        test-on-borrow: false
        test-on-return: false
        pool-prepared-statements: true
        max-pool-prepared-statement-per-connection-size: 20
      primary: master
      datasource:
        master:
          url: jdbc:postgresql://127.0.0.1:5432/sinopec?currentSchema=platform
          username: postgres
          password: Coolhomer
        slave:
          lazy: true
          url: jdbc:postgresql://127.0.0.1:5432/sinopec?currentSchema=platform
          username: postgres
          password: Coolhomer
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      database: 0
      password: 123456
  rabbitmq:
    host: 127.0.0.1
    port: 5672
    username: guest
    password: guest
  kafka:
    bootstrap-servers: 127.0.0.1:9092
  boot:
    admin:
      client:
        instance:
          service-host-type: IP

--- #################### MQ 消息队列相关配置 ####################

rocketmq:
  name-server: 127.0.0.1:9876

--- #################### 定时任务相关配置 ####################

xxl:
  job:
    enabled: false
    admin:
      addresses: http://127.0.0.1:9090/xxl-job-admin

--- #################### 服务保障相关配置 ####################

lock4j:
  acquire-timeout: 3000
  expire: 30000

--- #################### 监控相关配置 ####################

management:
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: '*'

logging:
  level:
    cn.cheers.x.module.platform.runtime.dal.mysql: info
    org.springframework.context.support.PostProcessorRegistrationDelegate: ERROR

--- #################### 芋道相关配置 ####################

yudao:
  # 本地前端已传 isEncrypt=false；关闭全局 API 加解密，避免与 X-Api-Encrypt 行为混淆
  api-encrypt:
    enable: false
  tenant:
    enable: true
    ignore-urls:
      - /admin-api/system/tenant/**
      - /admin-api/system/user/profile/**
      - /admin-api/system/auth/**
    ignore-visit-urls:
      - /admin-api/system/tenant/**
      - /admin-api/system/user/profile/**
      - /admin-api/system/auth/**
  env:
    tag: ${HOSTNAME}
  captcha:
    enable: false
  security:
    mock-enable: true
  # 直连微服务时 Feign 写访问日志易因 classpath 不完整失败；本地关闭
  access-log:
    enable: false
