--- #################### 注册中心 + 配置中心相关配置 ####################

spring:
  cloud:
    nacos:
      server-addr: 127.0.0.1:8848
      username: nacos
      password: nacos
      discovery:
        namespace: dev
        group: DEFAULT_GROUP
        ip: 127.0.0.1
        metadata:
          version: 1.0.0
      config:
        namespace: dev
        group: DEFAULT_GROUP
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration/dynamicbusiness
    table: flyway_schema_history_dynamicbusiness
    schemas: dynamicbusiness
    default-schema: dynamicbusiness
    create-schemas: true
    repair-on-migrate: true
    ignore-migration-patterns: "*:missing"
  autoconfigure:
    exclude:
  datasource:
    druid:
      web-stat-filter:
        enabled: true
      stat-view-servlet:
        enabled: true
        allow:
        url-pattern: /druid/*
        login-username:
        login-password:
      filter:
        stat:
          enabled: true
          log-slow-sql: true
          slow-sql-millis: 100
          merge-sql: true
        wall:
          config:
            multi-statement-allow: true
    dynamic:
      druid:
        initial-size: 1
        min-idle: 1
        max-active: 20
        max-wait: 60000
        time-between-eviction-runs-millis: 60000
        min-evictable-idle-time-millis: 600000
        max-evictable-idle-time-millis: 1800000
        validation-query: SELECT 1
        driver-class-name: org.postgresql.Driver
        test-while-idle: true
        test-on-borrow: false
        test-on-return: false
        pool-prepared-statements: true
        max-pool-prepared-statement-per-connection-size: 20
      primary: master
      datasource:
        master:
          url: jdbc:postgresql://127.0.0.1:5432/sinopec?currentSchema=dynamicbusiness
          username: postgres
          password: Coolhomer
        slave:
          lazy: true
          url: jdbc:postgresql://127.0.0.1:5432/sinopec?currentSchema=dynamicbusiness
          username: postgres
          password: Coolhomer
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      database: 0
      password: 123456
  rabbitmq:
    host: 127.0.0.1
    port: 5672
    username: guest
    password: guest
  kafka:
    bootstrap-servers: 127.0.0.1:9092
  boot:
    admin:
      client:
        instance:
          service-host-type: IP

--- #################### MQ 消息队列相关配置 ####################

rocketmq:
  name-server: 127.0.0.1:9876

--- #################### 定时任务相关配置 ####################

xxl:
  job:
    enabled: false
    admin:
      addresses: http://127.0.0.1:9090/xxl-job-admin

--- #################### 服务保障相关配置 ####################

lock4j:
  acquire-timeout: 3000
  expire: 30000

--- #################### 监控相关配置 ####################

management:
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: '*'

logging:
  level:
    cn.cheers.x.module.dynamicbusiness.dal.mysql: info
    cn.cheers.x.module.dynamicbusiness.dal.mysql.sms.SmsChannelMapper: info
    org.springframework.context.support.PostProcessorRegistrationDelegate: ERROR

--- #################### Cheers 相关配置 ####################

device-history:
  enabled: true
  jdbc-url: jdbc:postgresql://127.0.0.1:5432/device_history
  username: device_history
  password: ${DEVICE_HISTORY_DB_PASSWORD:Coolhomer}

point-gateway:
  enabled: true
  server-url: opc.tcp://192.168.10.16:4990/FactoryTalkLinxGateway1/

# 正常读数写入历史之后，按「设备状态」发给正在看这台设备的页面。
# 消息服务没连上只记日志。页面这时仍显示上一次打开时读到的历史。
equipment:
  page-push:
    enabled: true
    broker: tcp://127.0.0.1:1883
    client-id: equipment-page-push
    username: platform:event
    password: ${PAGE_MQTT_PASSWORD:}

# 告警发出后走同一条消息通道。联动自己订，不让告警包直接调用联动。
dynamicbusiness:
  event-channel:
    enabled: true
    broker: tcp://127.0.0.1:1883
    publisher-client-id: platform-event-publisher
    subscriber-client-id: linkage-event-subscriber
    username: platform:event
    password: ${PAGE_MQTT_PASSWORD:}

cheers:
  api-encrypt:
    enable: false
  push-catalog:
    token: ${PUSH_CATALOG_TOKEN:}
  tenant:
    enable: true
    ignore-urls:
      - /admin-api/system/tenant/**
      - /admin-api/system/user/profile/**
      - /admin-api/system/auth/**
    ignore-visit-urls:
      - /admin-api/system/tenant/**
      - /admin-api/system/user/profile/**
      - /admin-api/system/auth/**
  env:
    tag: ${HOSTNAME}
  captcha:
    enable: false
  security:
    mock-enable: true
  access-log:
    enable: false
