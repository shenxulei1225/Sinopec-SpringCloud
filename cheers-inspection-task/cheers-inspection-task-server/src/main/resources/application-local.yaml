--- #################### 注册中心 + 配置中心相关配置 ####################

spring:
  cloud:
    nacos:
      server-addr: 127.0.0.1:8848
      username: nacos
      password: nacos
      discovery:
        namespace: dev
        group: DEFAULT_GROUP
        ip: 127.0.0.1
        metadata:
          version: 1.0.0
      config:
        namespace: dev
        group: DEFAULT_GROUP

--- #################### 数据库相关配置 ####################
spring:
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration
    table: flyway_schema_history_inspection_task
    schemas: inspection_task
    default-schema: inspection_task
    # 本地开发：V1 脚本变更后自动 repair，避免 checksum mismatch 导致启动失败
    repair-on-migrate: true
  autoconfigure:
    exclude:
  datasource:
    druid:
      web-stat-filter:
        enabled: true
      stat-view-servlet:
        enabled: true
        allow:
        url-pattern: /druid/*
        login-username:
        login-password:
      filter:
        stat:
          enabled: true
          log-slow-sql: true
          slow-sql-millis: 100
          merge-sql: true
        wall:
          config:
            multi-statement-allow: true
    dynamic:
      druid:
        initial-size: 1
        min-idle: 1
        max-active: 20
        max-wait: 60000
        time-between-eviction-runs-millis: 60000
        min-evictable-idle-time-millis: 600000
        max-evictable-idle-time-millis: 1800000
        validation-query: SELECT 1
        driver-class-name: org.postgresql.Driver
        test-while-idle: true
        test-on-borrow: false
        test-on-return: false
        pool-prepared-statements: true
        max-pool-prepared-statement-per-connection-size: 20
      primary: master
      datasource:
        master:
          url: jdbc:postgresql://127.0.0.1:5432/sinopec?currentSchema=inspection_task
          username: postgres
          password: Coolhomer
        slave:
          lazy: true
          url: jdbc:postgresql://127.0.0.1:5432/sinopec?currentSchema=inspection_task
          username: postgres
          password: Coolhomer

  data:
    redis:
      host: 127.0.0.1
      port: 6379
      database: 0
      password: 123456

--- #################### MQ 消息队列相关配置 ####################

spring:
  rabbitmq:
    host: 127.0.0.1
    port: 5672
    username: guest
    password: guest

--- #################### 定时任务相关配置 ####################
xxl:
  job:
    enabled: false
    admin:
      addresses: http://127.0.0.1:9090/xxl-job-admin

--- #################### 服务保障相关配置 ####################

lock4j:
  acquire-timeout: 3000
  expire: 30000

--- #################### 监控相关配置 ####################

management:
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: '*'

spring:
  boot:
    admin:
      client:
        instance:
          service-host-type: IP
        username: admin
        password: admin

logging:
  level:
    cn.cheers.x.inspection.task.dal.mysql: debug
    org.springframework.context.support.PostProcessorRegistrationDelegate: ERROR

--- #################### Cheers 相关配置 ####################

# 第 3 步试译 Feign 调 cheers-device-protocol-gateway-server（默认 8095）。
# 报 preview-translate 不存在：查 Nacos 是否注册该服务、8095 进程是否为本仓库编译、Feign 是否打到别的实例。
# 本地：.\start-microservices.ps1 restart protocol（改网关代码后 mvn install 再重启）。

# 任务级录像（本地默认对接 media-gateway/go2rtc，先 .\setup-local-patrol-media.ps1 启动网关）
# host 是流媒体服务器。设备、登记、回放、抽帧都用这一台。
# ingest-protocol 只填 rtsp 或 rtmp。rtsp 收在 8554，rtmp 收在 1935。
patrol:
  media:
    host: ${PATROL_MEDIA_HOST:47.117.153.179}
    ingest-protocol: ${PATROL_MEDIA_INGEST_PROTOCOL:rtmp}
    frame-interval-ms: ${PATROL_FRAME_INTERVAL_MS:3000}

cheers:
  env:
    tag: ${HOSTNAME}
  captcha:
    enable: false
  security:
    mock-enable: false
  access-log:
    enable: true
